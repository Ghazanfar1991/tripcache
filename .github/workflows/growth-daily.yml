name: Growth Daily

on:
  schedule:
    - cron: "0 19 * * *"
      timezone: "Australia/Sydney"
  workflow_dispatch:

concurrency:
  group: growth-daily
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GSC_SITE_URL: sc-domain:trip-cache.com
      GA4_PROPERTY_ID: "514130776"
      REVENUECAT_PROJECT_ID: "82e83e04"
      REVENUECAT_API_KEY: ${{ secrets.REVENUECAT_API_KEY }}
      GOOGLE_PLAY_REPORT_BUCKET: ${{ vars.GOOGLE_PLAY_REPORT_BUCKET }}
      GOOGLE_PLAY_PACKAGE_NAME: app.tripcache
      FIREBASE_CRASHLYTICS_DATASET: firebase_crashlytics
      APP_STORE_APP_ID: "6758403056"
      APP_STORE_CONNECT_ISSUER_ID: ${{ vars.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_KEY_ID: ${{ vars.APP_STORE_CONNECT_KEY_ID }}
      APP_STORE_CONNECT_VENDOR_NUMBER: ${{ vars.APP_STORE_CONNECT_VENDOR_NUMBER }}
      APP_STORE_CONNECT_PRIVATE_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY_BASE64 }}
      TZ: Australia/Sydney
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Connector preflight
        id: connector-preflight
        env:
          REVENUECAT_API_KEY: ${{ secrets.REVENUECAT_API_KEY }}
        run: |
          if [[ -n "$REVENUECAT_API_KEY" && -n "$GCP_PROJECT_ID" && -n "${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}" && -n "${{ vars.GCP_SERVICE_ACCOUNT }}" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Core growth collection is disabled until Google OIDC and the RevenueCat read-only key are configured. Optional store/Crashlytics connectors may remain pending."
          fi

      - if: ${{ steps.connector-preflight.outputs.ready == 'true' }}
        run: npm ci

      - id: google-auth
        if: ${{ steps.connector-preflight.outputs.ready == 'true' }}
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          project_id: ${{ vars.GCP_PROJECT_ID }}
          token_format: access_token
          access_token_scopes: >-
            https://www.googleapis.com/auth/cloud-platform,
            https://www.googleapis.com/auth/analytics.readonly,
            https://www.googleapis.com/auth/webmasters.readonly,
            https://www.googleapis.com/auth/devstorage.read_only

      - if: ${{ steps.google-auth.outcome == 'success' }}
        uses: google-github-actions/setup-gcloud@v3

      - name: Collect and snapshot
        if: ${{ steps.connector-preflight.outputs.ready == 'true' }}
        run: npm run growth:daily
        env:
          GOOGLE_ACCESS_TOKEN: ${{ steps.google-auth.outputs.access_token }}

      - name: Sync sanitized aggregates to BigQuery
        if: ${{ steps.connector-preflight.outputs.ready == 'true' && steps.google-auth.outcome == 'success' }}
        run: node growth/scripts/sync-bigquery.mjs

      - name: Production health
        if: ${{ steps.connector-preflight.outputs.ready == 'true' }}
        run: npm run growth:health

      - name: Commit growth memory
        if: ${{ steps.connector-preflight.outputs.ready == 'true' }}
        run: |
          if git diff --quiet -- growth; then
            exit 0
          fi
          git config user.name "tripcache-growth-bot"
          git config user.email "tripcache-growth-bot@users.noreply.github.com"
          git add growth/data growth/state growth/data-manifest.json growth/reports
          git commit -m "growth(data): refresh daily sanitized snapshots"
          git push
