name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run growth:validate
      - run: npm run build
      - run: npm run growth:health -- --base-url http://127.0.0.1:3000
        env:
          START_LOCAL_SITE: "1"
